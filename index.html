:root{
  --ink:#14201E; --bg:#EAEFED; --surface:#FFFFFF; --surface2:#F6FAF8;
  --brand-shah:#15566A; --brand-kit:#3E8DAE; --landing-bg:#EBECE8;
  --teal:#0F6E64; --teal-d:#0A4A43; --teal-l:#E2EFEC;
  --accent:#DA5B34; --accent-l:#FBE9E2;
  --amber:#B07A1E; --amber-l:#F7EFD9;
  --line:#D7E0DD; --muted:#5E6E6A;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --ink:#E8EDEB; --bg:#0F1513; --surface:#1A2321; --surface2:#242F2C;
  --teal:#37A392; --teal-d:#8FD9CC; --teal-l:#1C3431;
  --accent:#E97C55; --accent-l:#3B241C;
  --amber:#D9A44A; --amber-l:#382F1C;
  --line:#2F3C38; --muted:#98A8A3;
}
[data-theme="dark"] .badge.extra{background:#2E2740;color:#C9B8F0}
[data-theme="dark"] .topbar{background:rgba(15,21,19,.86)}
[data-theme="dark"] .tabbar{background:rgba(26,35,33,.92)}
[data-theme="dark"] .mcell.filled.out{opacity:.5}
.backarr{border:none;background:var(--surface2);width:34px;height:34px;min-width:34px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.backarr:active{opacity:.7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.scrub-root{font-family:var(--font);color:var(--ink);background:var(--bg);
  min-height:100vh;max-width:520px;margin:0 auto;position:relative;line-height:1.45;
  display:flex;flex-direction:column}
.scrub-root button{font-family:inherit;cursor:pointer}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(234,239,237,.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 18px 12px}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.wordmark{font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--brand-shah);display:flex;align-items:baseline}
.wordmark .kit{color:var(--brand-kit)}
.wordmark .dot{color:var(--teal);font-size:26px;line-height:0}
.subtitle{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.siteswitch{display:flex;gap:8px;margin-top:12px}
.siteswitch button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:9px 10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.siteswitch button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.topbar-actions{display:flex;align-items:center;gap:9px}
.siteflip{position:relative}
.gear .flipdot{width:8px;height:8px;border-radius:50%;position:absolute;top:7px;right:7px;border:1.5px solid var(--surface)}
.popscrim{position:fixed;inset:0;z-index:15}
.sitepop{position:absolute;right:0;top:46px;z-index:26;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(20,32,30,.16);padding:8px;min-width:180px}
.sitepop-title{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px}
.sitepop-opt{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;border-radius:10px;
  padding:11px 10px;font-weight:700;font-size:14.5px;color:var(--ink);text-align:left}
.sitepop-opt.on{background:var(--surface2)}
.sitepop-opt .tick{margin-left:auto;color:var(--teal);display:inline-flex}
.badge.mach{background:#ECE6F8;color:#5B3FA6}
.badge.extra{background:#E6EEF6;color:#2E6699}
.landing{margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;width:100%;padding:24px;background:var(--landing-bg)}
.landing img{width:100%;max-width:390px;height:auto;border-radius:16px}
.gear{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}

/* scroll body */
.body{flex:1;overflow-y:auto;padding:16px 16px 96px;-webkit-overflow-scrolling:touch}
.viewhead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
.viewhead h2{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:0}
.viewhead .meta{font-size:13px;color:var(--muted);font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:14px;box-shadow:0 1px 2px rgba(20,32,30,.04)}
.card+.card{margin-top:10px}
.daygroup{margin-top:18px}
.daygroup:first-child{margin-top:0}
.dayhead{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--ink);
  margin:0 4px 9px;display:flex;align-items:center;gap:8px}
.dayhead .rel{color:var(--teal)}
.dayhead .date{color:var(--muted);font-weight:600}

/* session */
.sess{display:flex;gap:13px;align-items:flex-start}
.sess .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;min-width:46px;
  font-family:var(--mono);letter-spacing:-.02em;color:var(--ink);padding-top:1px}
.sess .time small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.sess .body-c{flex:1;min-width:0}
.sess .proc{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.sess .surg{font-size:13.5px;color:var(--muted);margin-top:1px}
.sess .notes{font-size:13px;color:var(--muted);margin-top:6px;
  background:var(--surface2);border-radius:9px;padding:7px 9px;border:1px solid var(--line)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:4px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.sitedot{width:9px;height:9px;border-radius:50%;flex:none}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px}
.badge.inst{background:var(--teal-l);color:var(--teal-d)}
.badge.cons{background:var(--accent-l);color:#9a3415}
.badge.extra{background:#ece4f7;color:#5b3c9a}

/* location address tag \u2014 signature element */
.loc{display:inline-flex;align-items:center;gap:0;font-family:var(--mono);font-size:11.5px;
  font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  padding:4px 4px;color:var(--ink);flex-wrap:wrap}
.loc .seg{padding:0 6px;white-space:nowrap}
.loc .div{color:var(--line)}
.loc .sitepin{width:7px;height:7px;border-radius:50%;margin:0 2px 0 4px}
.loc.unknown{background:var(--amber-l);border-color:#e6d6ad;color:var(--amber);font-family:var(--font);font-weight:700}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:11px 14px;font-weight:700;font-size:14.5px;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn:active{transform:translateY(1px)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:84px;z-index:25;
  background:var(--teal);color:#fff;border:none;border-radius:16px;height:52px;padding:0 18px;
  font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px rgba(15,110,100,.34)}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.02em}
.tab.active{color:var(--teal)}
.tab .ico{transition:transform .15s}
.tab.active .ico{transform:translateY(-1px)}

/* search */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:13px;padding:14px 14px 14px 42px;font-size:16px;font-weight:600;color:var(--ink)}
.searchwrap .sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchwrap input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}

/* filter chips row */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsel{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;max-width:52%}
[data-theme="dark"] .fchip.on{background:#E8EDEB;border-color:#E8EDEB;color:#101614}

/* result row */
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qty{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--surface2);
  border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty.low{background:var(--amber-l);border-color:#e6d6ad;color:var(--amber)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:34px;background:var(--surface);border:none;font-size:18px;font-weight:700;color:var(--teal);display:grid;place-items:center}
.stepper button:active{background:var(--teal-l)}
.stepper .val{min-width:34px;text-align:center;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;border-left:1px solid var(--line);border-right:1px solid var(--line);height:34px;line-height:34px}

/* pref card tile */
.pcard{display:flex;align-items:center;gap:13px}
.pcard .ring{flex:none}
.pcard .grow{flex:1;min-width:0}
.pcard .proc{font-weight:800;font-size:16px;letter-spacing:-.015em}
.pcard .surg{font-size:13.5px;color:var(--muted);margin-top:1px}
.pcard .counts{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:7px;flex-wrap:wrap}
.count{font-weight:700}

/* prep checklist */
.prephead{background:var(--teal-d);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;
  display:flex;align-items:center;gap:16px}
.prephead .grow{flex:1;min-width:0}
.prephead .proc{font-weight:800;font-size:18px;letter-spacing:-.02em}
.prephead .surg{font-size:13.5px;opacity:.85;margin-top:2px}
.prephead .pct{font-family:var(--mono);font-weight:800;font-size:13px;margin-top:8px;opacity:.95}
.routegroup{margin-top:16px}
.routehead{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);margin:0 4px 8px;display:flex;align-items:center;gap:7px}
.check{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px}
.check+.check{margin-top:8px}
.check.done{background:var(--surface2);opacity:.62}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;background:#fff;transition:.12s}
.check.done .box{background:var(--teal);border-color:var(--teal)}
.check .nm{flex:1;font-weight:700;font-size:14.5px}
.check.done .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.check .q{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--muted)}

/* progress ring */
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .label{position:absolute;font-family:var(--mono);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}

/* empty */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .ico{width:56px;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;margin:0 auto 14px;color:var(--teal)}
.empty h3{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 5px}
.empty p{font-size:14px;margin:0 0 16px;max-width:280px;margin-left:auto;margin-right:auto}

/* sheet / modal */
.backdrop{position:fixed;inset:0;background:rgba(20,32,30,.42);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;animation:slideup .2s cubic-bezier(.2,.8,.2,1);
  padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 6px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:11px;padding:12px;font-size:16px;font-weight:600;color:var(--ink);font-family:inherit}
.field textarea{min-height:62px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.field2{display:flex;gap:10px}
.field2>*{flex:1}
.field3{display:flex;gap:8px}
.field3>*{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:11px 8px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rowline input.nm{flex:1}
.rowline input.q{width:62px;text-align:center}
.rowline .del{width:40px;height:44px;border:1px solid var(--line);background:var(--surface);
  border-radius:11px;color:var(--accent);font-size:18px;flex:none;display:grid;place-items:center}
.addrow{font-size:13.5px;font-weight:700;color:var(--teal);background:var(--teal-l);
  border:1px dashed #aacfc8;border-radius:11px;padding:11px;width:100%;margin-top:4px}
.sheetfoot{display:flex;gap:10px;margin-top:18px}
.sheetfoot .btn{flex:1}
.delbtn{color:var(--accent);background:var(--accent-l);border-color:#f0cbbd}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:700;font-size:14px;padding:8px}
.settrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.settrow:last-child{border-bottom:none}
.hint{font-size:12.5px;color:var(--muted);margin:2px 2px 14px;line-height:1.5}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.calarrow{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.calperiod{font-size:19px;font-weight:800;letter-spacing:-.02em;text-align:center}
.calctrls{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.calctrls .seg{flex:1}
.month .mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.month .mhead div{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mcell{min-height:66px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:5px 4px 4px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;overflow:hidden}
.mcell.out{background:transparent;border-color:transparent}
.mcell.out .dnum{color:#aab6b3}
.mcell.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.mcell .dnum{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;padding-left:2px}
.mcell.today .dnum{color:var(--teal)}
.mcell .bars{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sbar{font-size:8.5px;font-weight:800;color:#fff;border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;line-height:1.5}
.mcell .more{font-size:9px;font-weight:700;color:var(--muted);padding-left:2px}
.mcell.filled .dnum{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-weight:800}
.mcell{position:relative}
.mshort{margin-top:auto;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1px;line-height:1.2}
.mstar{position:absolute;top:2px;right:3px;font-size:9px;line-height:1;color:var(--amber)}
.mstar.on{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.authchip{margin-left:8px;font-size:10.5px;font-weight:800;color:var(--teal-d);background:var(--teal-l);padding:2px 7px;border-radius:6px;white-space:nowrap}
.authbtn{margin-top:8px;border:1px solid var(--teal);background:var(--teal-l);color:var(--teal-d);border-radius:9px;padding:7px 11px;font-weight:800;font-size:12.5px}
.authbtn.done{border-color:var(--line);background:var(--surface2);color:var(--ink);font-weight:700}
.acwrap{position:relative;flex:1}
.acwrap .nm{width:100%}
.acmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px rgba(20,32,30,.2);max-height:220px;overflow:auto;padding:4px}
.acopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:11px 10px;font-size:14.5px;font-weight:600;color:var(--ink)}
.acopt:active{background:var(--surface2)}
.acopt .sub{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.acopt.create{color:var(--teal-d);font-weight:800}
.mcell.filled.out{opacity:.42}
.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 9px;text-align:left}
.ymhead{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:6px}
.ymgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ycell{aspect-ratio:1;border-radius:2px;background:var(--surface2)}
.ycell.out{background:transparent}
.ctxscrim{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(20,32,30,.4);padding:24px}
.ctxmenu{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(20,32,30,.28);padding:8px;width:100%;max-width:260px}
.ctxtitle{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
.ctxopt{width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:13px 12px;font-size:15px;font-weight:700;color:var(--ink)}
.ctxopt:active{background:var(--surface2)}
.ctxopt.danger{color:var(--accent)}
.weekrow{display:flex;align-items:center;gap:13px}
.wdate{display:flex;flex-direction:column;align-items:center;min-width:42px}
.wdate .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.wdate .dn{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wdate.today .dn,.wdate.today .wd{color:var(--teal)}
.wshifts{flex:1;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.shiftline,.caseline{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.shiftline .grow,.caseline .grow{flex:1;min-width:0}
.cbar{width:5px;align-self:stretch;border-radius:99px;flex:none;min-height:30px}
.snm{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.ssub{font-size:12.5px;color:var(--muted);margin-top:2px}
.patpick{display:flex;flex-wrap:wrap;gap:8px}
.patchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.patchip:disabled,.patchip.assigned{opacity:.5}
.patchip.newp{border-style:dashed;color:var(--teal);border-color:#aacfc8}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:34px;height:34px;border-radius:10px;border:none;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.xbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--accent);font-size:18px;flex:none;display:grid;place-items:center}
.muted{color:var(--muted)}
.loced{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.loced-row{display:flex;gap:8px;align-items:center}
.loced-row+.loced-row{margin-top:8px}
.loced-row select{flex:1}
.loced-row input{flex:1;min-width:0}

/* sticky sheet header so Save is always reachable */
.sheethead{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);padding:4px 2px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sheethead h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.btn[disabled]{opacity:.4;pointer-events:none}
.timeedit{display:flex;align-items:center;gap:7px;margin-top:6px}
.timeedit input{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:700;font-family:var(--mono);color:var(--ink);width:auto}
.timeedit input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-l)}
.stats{display:flex;gap:10px;margin:6px 0 6px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center}
.stat.total{background:var(--teal);border-color:var(--teal)}
.stat .sv{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sl{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.03em}
.stat.total .sv{color:#fff}
.stat.total .sl{color:#fff;opacity:.85}
